server:
  port: 8080

spring:
  application:
    name: coexistree
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coexistree}
    username: ${DB_USERNAME:coexistree}
    password: ${DB_PASSWORD:coexistree}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  file:
    name: ./data/logs/coexistree.log
  level:
    root: INFO
    io.github.xiaoailazy.coexistree: INFO

llm:
  openai:
    api-key: ${LLM_API_KEY}
    model: ${LLM_MODEL:gpt-4o-mini}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    temperature: 0.3
    max-tokens: 4096
    timeout: 60000

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
  expiration: 86400000
  issuer: CoExistree

admin:
  username: admin
  password: ${ADMIN_INITIAL_PASSWORD:admin123}
  display-name: 系统管理员
