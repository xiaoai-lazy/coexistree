# Test profile configuration
# Uses Testcontainers PostgreSQL for integration tests

server:
  port: 0  # Random port for parallel test execution

spring:
  datasource:
    url: jdbc:tc:postgresql:16:///coexistree_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    root: WARN
    io.github.xiaoailazy.coexistree: INFO
    org.springframework.test: INFO
    org.hibernate.SQL: DEBUG
    dev.langchain4j: DEBUG

llm:
  openai:
    api-key: ${LLM_API_KEY:test-api-key}
    model: ${LLM_MODEL:gpt-4o-mini}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    timeout: ${LLM_TIMEOUT:60000}
    enabled: ${LLM_TEST_ENABLED:false}

jwt:
  secret: test-secret-key-that-is-long-enough-for-hs256-algorithm-at-least-32-bytes

admin:
  password: test-admin-password
